name: design_system
resolution: workspace
publish_to: "none"

environment:
  sdk: ^3.14.0
  flutter: ^3.50.0

dependencies:
  cached_network_image_ce: ^4.13.2
  clock: ^1.1.3
  dotlottie_flutter: ^0.2.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.4.0
  material_ui: ^1.11.1
  skeletonizer: ^3.0.0
  slang: ^4.19.2
  slang_flutter: ^4.19.0

dev_dependencies:
  archive: ^4.0.7
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/faces.lottie
  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Variable.ttf
    - family: AppIcons
      fonts:
        - asset: assets/fonts/app_icons.ttf
