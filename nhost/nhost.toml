[global]

[[global.environment]]
name = 'FCM_SERVICE_ACCOUNT'
value = '{{ secrets.FCM_SERVICE_ACCOUNT }}'

[[global.environment]]
name = 'REVENUECAT_WEBHOOK_AUTH'
value = '{{ secrets.REVENUECAT_WEBHOOK_AUTH }}'

[[global.environment]]
name = 'CHAT_API_URL'
value = '{{ secrets.CHAT_API_URL }}'

[[global.environment]]
name = 'CHAT_API_KEY'
value = '{{ secrets.CHAT_API_KEY }}'

[[global.environment]]
name = 'CHAT_MODEL'
value = '{{ secrets.CHAT_MODEL }}'

# OpenCode Go routes by session and answers without reasoning when it is disabled; neither value is secret.
[[global.environment]]
name = 'CHAT_EXTRA_HEADERS'
value = '{"x-opencode-session":"{session}"}'

[[global.environment]]
name = 'CHAT_EXTRA_BODY'
value = '{"thinking":{"type":"disabled"}}'

[hasura]
version = 'v2.48.10-ce'
adminSecret = '{{ secrets.HASURA_GRAPHQL_ADMIN_SECRET }}'
webhookSecret = '{{ secrets.NHOST_WEBHOOK_SECRET }}'

[[hasura.jwtSecrets]]
type = 'RS256'
key = '{{ secrets.NHOST_JWT_PUBLIC_KEY }}'
signingKey = '{{ secrets.NHOST_JWT_PRIVATE_KEY }}'
kid = '{{ secrets.NHOST_JWT_KID }}'

[hasura.settings]
corsDomain = ['*']
devMode = false
enableAllowList = false
enableConsole = false
enableRemoteSchemaPermissions = false
enabledAPIs = ['metadata', 'graphql', 'pgdump', 'config']
inferFunctionPermissions = false
liveQueriesMultiplexedRefetchInterval = 1000
stringifyNumericTypes = false

[hasura.logs]
level = 'warn'

[hasura.events]
httpPoolSize = 100

[hasura.rateLimit]
limit = 600
interval = '1m'

[functions]
[functions.rateLimit]
limit = 120
interval = '1m'

[functions.node]
version = 24

[auth]
version = '0.52.0'

[auth.elevatedPrivileges]
mode = 'disabled'

[auth.redirections]
clientUrl = 'mingo://auth'

[auth.signUp]
enabled = true
disableNewUsers = false
disableAutoSignup = false

[auth.user]
[auth.user.roles]
default = 'user'
allowed = ['user']

[auth.user.locale]
default = 'en'
allowed = ['en']

[auth.user.gravatar]
enabled = false
default = 'blank'
rating = 'g'

[auth.user.email]

[auth.user.emailDomains]

[auth.session]
[auth.session.accessToken]
expiresIn = 900

[auth.session.refreshToken]
expiresIn = 2592000

[auth.method]
[auth.method.anonymous]
enabled = false

[auth.method.emailPasswordless]
enabled = false

[auth.method.otp]
[auth.method.otp.email]
enabled = false

[auth.method.otp.sms]
enabled = false

[auth.method.emailPassword]
hibpEnabled = true
emailVerificationRequired = false
passwordMinLength = 9

[auth.method.smsPasswordless]
enabled = false

[auth.method.oauth]
[auth.method.oauth.apple]
enabled = false
clientId = '{{ secrets.APPLE_CLIENT_ID }}'
teamId = '{{ secrets.APPLE_TEAM_ID }}'
keyId = '{{ secrets.APPLE_KEY_ID }}'
privateKey = '{{ secrets.APPLE_PRIVATE_KEY }}'
audience = '{{ secrets.APPLE_AUDIENCE }}'

[auth.method.oauth.azuread]
tenant = 'common'
enabled = false

[auth.method.oauth.bitbucket]
enabled = false

[auth.method.oauth.discord]
enabled = false

[auth.method.oauth.entraid]
tenant = 'common'
enabled = false

[auth.method.oauth.facebook]
enabled = false

[auth.method.oauth.github]
enabled = false

[auth.method.oauth.gitlab]
enabled = false

[auth.method.oauth.google]
enabled = false
clientId = '{{ secrets.GOOGLE_CLIENT_ID }}'
clientSecret = '{{ secrets.GOOGLE_CLIENT_SECRET }}'
audience = '{{ secrets.GOOGLE_AUDIENCE }}'

[auth.method.oauth.linkedin]
enabled = false

[auth.method.oauth.spotify]
enabled = false

[auth.method.oauth.strava]
enabled = false

[auth.method.oauth.twitch]
enabled = false

[auth.method.oauth.twitter]
enabled = false

[auth.method.oauth.windowslive]
enabled = false

[auth.method.oauth.workos]
enabled = false

[auth.method.webauthn]
enabled = false

[auth.method.webauthn.attestation]
timeout = 60000

[auth.totp]
enabled = false

[auth.oauth2Provider]
enabled = false

[auth.oauth2Provider.accessToken]
expiresIn = 900

[auth.oauth2Provider.refreshToken]
expiresIn = 2592000

[auth.oauth2Provider.clientIdMetadataDocument]
enabled = false

[auth.misc]
concealErrors = true

[auth.rateLimit]
[auth.rateLimit.emails]
limit = 10
interval = '1h'

[auth.rateLimit.sms]
limit = 10
interval = '1h'

[auth.rateLimit.bruteForce]
limit = 10
interval = '5m'

[auth.rateLimit.signups]
limit = 10
interval = '5m'

[auth.rateLimit.global]
limit = 100
interval = '1m'

[auth.rateLimit.oauth2Server]
limit = 100
interval = '5m'

[postgres]
version = '18.6-20260930-1'

[postgres.resources]
[postgres.resources.storage]
capacity = 1

[provider]

[storage]
version = '0.15.1'

[storage.rateLimit]
limit = 300
interval = '1m'

[observability]
[observability.grafana]
adminPassword = '{{ secrets.GRAFANA_ADMIN_PASSWORD }}'

[observability.grafana.alerting]
enabled = false

[observability.grafana.contacts]
