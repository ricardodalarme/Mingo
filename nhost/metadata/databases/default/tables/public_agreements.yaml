table:
  name: agreements
  schema: public
configuration:
  column_config:
    archived_at:
      custom_name: archivedAt
    author_id:
      custom_name: authorId
    body:
      custom_name: body
    confirmed_at:
      custom_name: confirmedAt
    confirmed_by:
      custom_name: confirmedBy
    couple_id:
      custom_name: coupleId
    created_at:
      custom_name: createdAt
    id:
      custom_name: id
    updated_at:
      custom_name: updatedAt
  custom_column_names:
    archived_at: archivedAt
    author_id: authorId
    body: body
    confirmed_at: confirmedAt
    confirmed_by: confirmedBy
    couple_id: coupleId
    created_at: createdAt
    id: id
    updated_at: updatedAt
  custom_name: agreements
  custom_root_fields:
    delete: deleteAgreements
    delete_by_pk: deleteAgreementsByPk
    insert: insertAgreements
    insert_one: insertAgreementsOne
    select: agreements
    select_aggregate: agreementsAggregate
    select_by_pk: agreementsByPk
    select_stream: agreementsStream
    update: updateAgreements
    update_by_pk: updateAgreementsByPk
    update_many: updateAgreementsMany
object_relationships:
  - name: author
    using:
      foreign_key_constraint_on: author_id
  - name: couple
    using:
      foreign_key_constraint_on: couple_id
array_relationships:
  - name: coupleMembers
    using:
      manual_configuration:
        column_mapping:
          couple_id: couple_id
        insertion_order: null
        remote_table:
          name: couple_members
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - couple_id:
              _is_null: true
          - coupleMembers:
              user_id:
                _eq: X-Hasura-User-Id
      set:
        author_id: X-Hasura-User-Id
      columns:
        - id
        - couple_id
        - body
select_permissions:
  - role: user
    permission:
      columns:
        - archived_at
        - author_id
        - body
        - confirmed_at
        - confirmed_by
        - couple_id
        - created_at
        - id
        - updated_at
      filter:
        _or:
          - author_id:
              _eq: X-Hasura-User-Id
          - coupleMembers:
              user_id:
                _eq: X-Hasura-User-Id
      allow_aggregations: true
update_permissions:
  - role: user
    permission:
      columns:
        - couple_id
        - body
        - archived_at
      filter:
        author_id:
          _eq: X-Hasura-User-Id
      check:
        _or:
          - couple_id:
              _is_null: true
          - coupleMembers:
              user_id:
                _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        author_id:
          _eq: X-Hasura-User-Id
