table:
  name: story_events
  schema: public
configuration:
  column_config:
    author_id:
      custom_name: authorId
    couple_id:
      custom_name: coupleId
    created_at:
      custom_name: createdAt
    date_precision:
      custom_name: datePrecision
    happened_on:
      custom_name: happenedOn
    id:
      custom_name: id
    kind:
      custom_name: kind
    title:
      custom_name: title
    updated_at:
      custom_name: updatedAt
  custom_column_names:
    author_id: authorId
    couple_id: coupleId
    created_at: createdAt
    date_precision: datePrecision
    happened_on: happenedOn
    id: id
    kind: kind
    title: title
    updated_at: updatedAt
  custom_name: storyEvents
  custom_root_fields:
    delete: deleteStoryEvents
    delete_by_pk: deleteStoryEventsByPk
    insert: insertStoryEvents
    insert_one: insertStoryEventsOne
    select: storyEvents
    select_aggregate: storyEventsAggregate
    select_by_pk: storyEventsByPk
    select_stream: storyEventsStream
    update: updateStoryEvents
    update_by_pk: updateStoryEventsByPk
    update_many: updateStoryEventsMany
object_relationships:
  - name: author
    using:
      foreign_key_constraint_on: author_id
  - name: couple
    using:
      foreign_key_constraint_on: couple_id
array_relationships:
  - name: coupleMembers
    using:
      manual_configuration:
        column_mapping:
          couple_id: couple_id
        insertion_order: null
        remote_table:
          name: couple_members
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - couple_id:
              _is_null: true
          - coupleMembers:
              user_id:
                _eq: X-Hasura-User-Id
      set:
        author_id: X-Hasura-User-Id
      columns:
        - id
        - couple_id
        - kind
        - title
        - happened_on
        - date_precision
select_permissions:
  - role: user
    permission:
      columns:
        - author_id
        - couple_id
        - created_at
        - date_precision
        - happened_on
        - id
        - kind
        - title
        - updated_at
      filter:
        _or:
          - author_id:
              _eq: X-Hasura-User-Id
          - coupleMembers:
              user_id:
                _eq: X-Hasura-User-Id
      allow_aggregations: true
update_permissions:
  - role: user
    permission:
      columns:
        - couple_id
        - kind
        - title
        - happened_on
        - date_precision
      filter:
        _or:
          - author_id:
              _eq: X-Hasura-User-Id
          - coupleMembers:
              user_id:
                _eq: X-Hasura-User-Id
      check:
        _or:
          - _and:
              - couple_id:
                  _is_null: true
              - author_id:
                  _eq: X-Hasura-User-Id
          - coupleMembers:
              user_id:
                _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          - author_id:
              _eq: X-Hasura-User-Id
          - coupleMembers:
              user_id:
                _eq: X-Hasura-User-Id
