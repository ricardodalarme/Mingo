table:
  name: partner_messages
  schema: public
configuration:
  column_config:
    body:
      custom_name: body
    created_at:
      custom_name: createdAt
    duration_ms:
      custom_name: durationMs
    for_widget:
      custom_name: forWidget
    hearted_at:
      custom_name: heartedAt
    id:
      custom_name: id
    kind:
      custom_name: kind
    media_file_id:
      custom_name: mediaFileId
    recipient_id:
      custom_name: recipientId
    seen_at:
      custom_name: seenAt
    sender_id:
      custom_name: senderId
  custom_column_names:
    body: body
    created_at: createdAt
    duration_ms: durationMs
    for_widget: forWidget
    hearted_at: heartedAt
    id: id
    kind: kind
    media_file_id: mediaFileId
    recipient_id: recipientId
    seen_at: seenAt
    sender_id: senderId
  custom_name: partnerMessages
  custom_root_fields:
    delete: deletePartnerMessages
    delete_by_pk: deletePartnerMessagesByPk
    insert: insertPartnerMessages
    insert_one: insertPartnerMessagesOne
    select: partnerMessages
    select_aggregate: partnerMessagesAggregate
    select_by_pk: partnerMessagesByPk
    select_stream: partnerMessagesStream
    update: updatePartnerMessages
    update_by_pk: updatePartnerMessagesByPk
    update_many: updatePartnerMessagesMany
object_relationships:
  - name: mediaFile
    using:
      foreign_key_constraint_on: media_file_id
  - name: recipient
    using:
      foreign_key_constraint_on: recipient_id
  - name: sender
    using:
      foreign_key_constraint_on: sender_id
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - media_file_id:
              _is_null: true
          - mediaFile:
              uploaded_by_user_id:
                _eq: X-Hasura-User-Id
      set:
        sender_id: X-Hasura-User-Id
      columns:
        - id
        - kind
        - body
        - media_file_id
        - for_widget
        - duration_ms
select_permissions:
  - role: user
    permission:
      columns:
        - body
        - created_at
        - duration_ms
        - for_widget
        - hearted_at
        - id
        - kind
        - media_file_id
        - recipient_id
        - seen_at
        - sender_id
      filter:
        _or:
          - sender_id:
              _eq: X-Hasura-User-Id
          - recipient_id:
              _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - seen_at
        - hearted_at
      filter:
        recipient_id:
          _eq: X-Hasura-User-Id
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        sender_id:
          _eq: X-Hasura-User-Id
