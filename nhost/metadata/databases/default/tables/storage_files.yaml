table:
  name: files
  schema: storage
configuration:
  column_config:
    bucket_id:
      custom_name: bucketId
    created_at:
      custom_name: createdAt
    etag:
      custom_name: etag
    id:
      custom_name: id
    is_uploaded:
      custom_name: isUploaded
    metadata:
      custom_name: metadata
    mime_type:
      custom_name: mimeType
    name:
      custom_name: name
    size:
      custom_name: size
    updated_at:
      custom_name: updatedAt
    uploaded_by_user_id:
      custom_name: uploadedByUserId
  custom_column_names:
    bucket_id: bucketId
    created_at: createdAt
    etag: etag
    id: id
    is_uploaded: isUploaded
    metadata: metadata
    mime_type: mimeType
    name: name
    size: size
    updated_at: updatedAt
    uploaded_by_user_id: uploadedByUserId
  custom_name: files
  custom_root_fields:
    delete: deleteFiles
    delete_by_pk: deleteFile
    insert: insertFiles
    insert_one: insertFile
    select: files
    select_aggregate: filesAggregate
    select_by_pk: file
    update: updateFiles
    update_by_pk: updateFile
object_relationships:
  - name: bucket
    using:
      foreign_key_constraint_on: bucket_id
array_relationships:
  - name: avatarOf
    using:
      foreign_key_constraint_on:
        column: avatar_file_id
        table:
          name: profiles
          schema: public
  - name: couplePhotos
    using:
      foreign_key_constraint_on:
        column: file_id
        table:
          name: couple_photos
          schema: public
  - name: memories
    using:
      foreign_key_constraint_on:
        column: photo_file_id
        table:
          name: memories
          schema: public
  - name: partnerMessages
    using:
      foreign_key_constraint_on:
        column: media_file_id
        table:
          name: partner_messages
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        bucket_id:
          _in:
            - avatars
            - slips
            - memories
            - messages
            - couple-photos
      set:
        uploaded_by_user_id: X-Hasura-User-Id
      columns:
        - id
        - bucket_id
        - name
        - size
        - mime_type
        - metadata
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        _or:
          - uploaded_by_user_id:
              _eq: X-Hasura-User-Id
          - avatarOf:
              membership:
                couple:
                  members:
                    user_id:
                      _eq: X-Hasura-User-Id
          - memories:
              _and:
                - coupleMembers:
                    user_id:
                      _eq: X-Hasura-User-Id
                - accepted_at:
                    _is_null: false
          - partnerMessages:
              recipient_id:
                _eq: X-Hasura-User-Id
          - couplePhotos:
              coupleMembers:
                user_id:
                  _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        uploaded_by_user_id:
          _eq: X-Hasura-User-Id
