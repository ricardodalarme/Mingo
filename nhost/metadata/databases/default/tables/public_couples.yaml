table:
  name: couples
  schema: public
configuration:
  column_config:
    created_at:
      custom_name: createdAt
    ended_at:
      custom_name: endedAt
    id:
      custom_name: id
    start_date:
      custom_name: startDate
    start_date_set_by:
      custom_name: startDateSetBy
    touch_topics_enabled:
      custom_name: touchTopicsEnabled
  custom_column_names:
    created_at: createdAt
    ended_at: endedAt
    id: id
    start_date: startDate
    start_date_set_by: startDateSetBy
    touch_topics_enabled: touchTopicsEnabled
  custom_name: couples
  custom_root_fields:
    delete: deleteCouples
    delete_by_pk: deleteCouplesByPk
    insert: insertCouples
    insert_one: insertCouplesOne
    select: couples
    select_aggregate: couplesAggregate
    select_by_pk: couplesByPk
    select_stream: couplesStream
    update: updateCouples
    update_by_pk: updateCouplesByPk
    update_many: updateCouplesMany
object_relationships:
  - name: photo
    using:
      foreign_key_constraint_on:
        column: couple_id
        table:
          name: couple_photos
          schema: public
array_relationships:
  - name: members
    using:
      foreign_key_constraint_on:
        column: couple_id
        table:
          name: couple_members
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - created_at
        - ended_at
        - id
        - start_date
        - start_date_set_by
        - touch_topics_enabled
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - touch_topics_enabled
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
      check: null
