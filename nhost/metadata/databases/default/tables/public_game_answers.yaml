table:
  name: game_answers
  schema: public
configuration:
  column_config:
    answer:
      custom_name: answer
    author_id:
      custom_name: authorId
    created_at:
      custom_name: createdAt
    id:
      custom_name: id
    idx:
      custom_name: idx
    session_id:
      custom_name: sessionId
  custom_column_names:
    answer: answer
    author_id: authorId
    created_at: createdAt
    id: id
    idx: idx
    session_id: sessionId
  custom_name: gameAnswers
  custom_root_fields:
    delete: deleteGameAnswers
    delete_by_pk: deleteGameAnswersByPk
    insert: insertGameAnswers
    insert_one: insertGameAnswersOne
    select: gameAnswers
    select_aggregate: gameAnswersAggregate
    select_by_pk: gameAnswersByPk
    select_stream: gameAnswersStream
    update: updateGameAnswers
    update_by_pk: updateGameAnswersByPk
    update_many: updateGameAnswersMany
object_relationships:
  - name: author
    using:
      foreign_key_constraint_on: author_id
  - name: session
    using:
      foreign_key_constraint_on: session_id
insert_permissions:
  - role: user
    permission:
      check:
        session:
          _and:
            - status:
                _eq: active
            - coupleMembers:
                user_id:
                  _eq: X-Hasura-User-Id
      set:
        author_id: X-Hasura-User-Id
      columns:
        - id
        - session_id
        - idx
        - answer
select_permissions:
  - role: user
    permission:
      columns:
        - answer
        - author_id
        - created_at
        - id
        - idx
        - session_id
      filter:
        _or:
          - author_id:
              _eq: X-Hasura-User-Id
          - session:
              _and:
                - status:
                    _eq: finished
                - coupleMembers:
                    user_id:
                      _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - answer
      filter:
        author_id:
          _eq: X-Hasura-User-Id
      check: null
