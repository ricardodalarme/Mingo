table:
  name: user_settings
  schema: public
configuration:
  column_config:
    card_channel:
      custom_name: cardChannel
    card_theme:
      custom_name: cardTheme
    chat_store_facts:
      custom_name: chatStoreFacts
    created_at:
      custom_name: createdAt
    has_kids:
      custom_name: hasKids
    holiday_countries:
      custom_name: holidayCountries
    locale:
      custom_name: locale
    low_stimulation:
      custom_name: lowStimulation
    onboarded_at:
      custom_name: onboardedAt
    partner_intent:
      custom_name: partnerIntent
    partner_name:
      custom_name: partnerName
    partner_pronouns:
      custom_name: partnerPronouns
    phase:
      custom_name: phase
    relationship_status:
      custom_name: relationshipStatus
    share_read_receipts:
      custom_name: shareReadReceipts
    slips_default_for_card:
      custom_name: slipsDefaultForCard
    spice_enabled:
      custom_name: spiceEnabled
    spice_max_level:
      custom_name: spiceMaxLevel
    spice_notifications:
      custom_name: spiceNotifications
    theme:
      custom_name: theme
    together_since:
      custom_name: togetherSince
    updated_at:
      custom_name: updatedAt
    user_id:
      custom_name: userId
    widget_allow_partner_notes:
      custom_name: widgetAllowPartnerNotes
    widget_on_lock_screen:
      custom_name: widgetOnLockScreen
    widget_show_names:
      custom_name: widgetShowNames
  custom_column_names:
    card_channel: cardChannel
    card_theme: cardTheme
    chat_store_facts: chatStoreFacts
    created_at: createdAt
    has_kids: hasKids
    holiday_countries: holidayCountries
    locale: locale
    low_stimulation: lowStimulation
    onboarded_at: onboardedAt
    partner_intent: partnerIntent
    partner_name: partnerName
    partner_pronouns: partnerPronouns
    phase: phase
    relationship_status: relationshipStatus
    share_read_receipts: shareReadReceipts
    slips_default_for_card: slipsDefaultForCard
    spice_enabled: spiceEnabled
    spice_max_level: spiceMaxLevel
    spice_notifications: spiceNotifications
    theme: theme
    together_since: togetherSince
    updated_at: updatedAt
    user_id: userId
    widget_allow_partner_notes: widgetAllowPartnerNotes
    widget_on_lock_screen: widgetOnLockScreen
    widget_show_names: widgetShowNames
  custom_name: userSettings
  custom_root_fields:
    delete: deleteUserSettings
    delete_by_pk: deleteUserSettingsByPk
    insert: insertUserSettings
    insert_one: insertUserSettingsOne
    select: userSettings
    select_aggregate: userSettingsAggregate
    select_by_pk: userSettingsByPk
    select_stream: userSettingsStream
    update: updateUserSettings
    update_by_pk: updateUserSettingsByPk
    update_many: updateUserSettingsMany
object_relationships:
  - name: profile
    using:
      foreign_key_constraint_on: user_id
array_relationships:
  - name: goals
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: user_goals
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - card_channel
        - card_theme
        - chat_store_facts
        - created_at
        - has_kids
        - holiday_countries
        - locale
        - low_stimulation
        - onboarded_at
        - partner_intent
        - partner_name
        - partner_pronouns
        - phase
        - relationship_status
        - share_read_receipts
        - slips_default_for_card
        - spice_enabled
        - spice_max_level
        - spice_notifications
        - theme
        - together_since
        - updated_at
        - user_id
        - widget_allow_partner_notes
        - widget_on_lock_screen
        - widget_show_names
      filter:
        user_id:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - theme
        - locale
        - phase
        - relationship_status
        - partner_name
        - partner_pronouns
        - partner_intent
        - together_since
        - onboarded_at
        - share_read_receipts
        - holiday_countries
        - card_channel
        - card_theme
        - slips_default_for_card
        - widget_allow_partner_notes
        - widget_on_lock_screen
        - widget_show_names
        - spice_enabled
        - low_stimulation
        - chat_store_facts
        - has_kids
        - spice_max_level
        - spice_notifications
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check: null
