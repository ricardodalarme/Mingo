table:
  name: lists
  schema: public
configuration:
  column_config:
    author_id:
      custom_name: authorId
    couple_id:
      custom_name: coupleId
    created_at:
      custom_name: createdAt
    id:
      custom_name: id
    kind:
      custom_name: kind
    title:
      custom_name: title
    updated_at:
      custom_name: updatedAt
  custom_column_names:
    author_id: authorId
    couple_id: coupleId
    created_at: createdAt
    id: id
    kind: kind
    title: title
    updated_at: updatedAt
  custom_name: lists
  custom_root_fields:
    delete: deleteLists
    delete_by_pk: deleteListsByPk
    insert: insertLists
    insert_one: insertListsOne
    select: lists
    select_aggregate: listsAggregate
    select_by_pk: listsByPk
    select_stream: listsStream
    update: updateLists
    update_by_pk: updateListsByPk
    update_many: updateListsMany
object_relationships:
  - name: author
    using:
      foreign_key_constraint_on: author_id
  - name: couple
    using:
      foreign_key_constraint_on: couple_id
array_relationships:
  - name: coupleMembers
    using:
      manual_configuration:
        column_mapping:
          couple_id: couple_id
        insertion_order: null
        remote_table:
          name: couple_members
          schema: public
  - name: items
    using:
      foreign_key_constraint_on:
        column: list_id
        table:
          name: list_items
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - couple_id:
              _is_null: true
          - coupleMembers:
              user_id:
                _eq: X-Hasura-User-Id
      set:
        author_id: X-Hasura-User-Id
      columns:
        - id
        - couple_id
        - title
        - kind
select_permissions:
  - role: user
    permission:
      columns:
        - author_id
        - couple_id
        - created_at
        - id
        - kind
        - title
        - updated_at
      filter:
        _or:
          - author_id:
              _eq: X-Hasura-User-Id
          - coupleMembers:
              user_id:
                _eq: X-Hasura-User-Id
      allow_aggregations: true
update_permissions:
  - role: user
    permission:
      columns:
        - couple_id
        - title
        - kind
      filter:
        _or:
          - author_id:
              _eq: X-Hasura-User-Id
          - coupleMembers:
              user_id:
                _eq: X-Hasura-User-Id
      check:
        _or:
          - _and:
              - couple_id:
                  _is_null: true
              - author_id:
                  _eq: X-Hasura-User-Id
          - coupleMembers:
              user_id:
                _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          - author_id:
              _eq: X-Hasura-User-Id
          - coupleMembers:
              user_id:
                _eq: X-Hasura-User-Id
