table:
  name: gift_ideas
  schema: public
configuration:
  column_config:
    author_id:
      custom_name: authorId
    created_at:
      custom_name: createdAt
    id:
      custom_name: id
    kind:
      custom_name: kind
    link:
      custom_name: link
    note:
      custom_name: note
    occasion_date_id:
      custom_name: occasionDateId
    status:
      custom_name: status
    title:
      custom_name: title
    updated_at:
      custom_name: updatedAt
  custom_column_names:
    author_id: authorId
    created_at: createdAt
    id: id
    kind: kind
    link: link
    note: note
    occasion_date_id: occasionDateId
    status: status
    title: title
    updated_at: updatedAt
  custom_name: giftIdeas
  custom_root_fields:
    delete: deleteGiftIdeas
    delete_by_pk: deleteGiftIdeasByPk
    insert: insertGiftIdeas
    insert_one: insertGiftIdeasOne
    select: giftIdeas
    select_aggregate: giftIdeasAggregate
    select_by_pk: giftIdeasByPk
    select_stream: giftIdeasStream
    update: updateGiftIdeas
    update_by_pk: updateGiftIdeasByPk
    update_many: updateGiftIdeasMany
object_relationships:
  - name: author
    using:
      foreign_key_constraint_on: author_id
  - name: occasion
    using:
      foreign_key_constraint_on: occasion_date_id
insert_permissions:
  - role: user
    permission:
      check: {}
      set:
        author_id: X-Hasura-User-Id
      columns:
        - id
        - kind
        - title
        - note
        - occasion_date_id
        - status
        - link
select_permissions:
  - role: user
    permission:
      columns:
        - author_id
        - created_at
        - id
        - kind
        - link
        - note
        - occasion_date_id
        - status
        - title
        - updated_at
      filter:
        _or:
          - author_id:
              _eq: X-Hasura-User-Id
          - _and:
              - kind:
                  _eq: wish
              - author:
                  membership:
                    couple:
                      members:
                        user_id:
                          _eq: X-Hasura-User-Id
      allow_aggregations: true
update_permissions:
  - role: user
    permission:
      columns:
        - title
        - note
        - occasion_date_id
        - status
        - link
      filter:
        author_id:
          _eq: X-Hasura-User-Id
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        author_id:
          _eq: X-Hasura-User-Id
