table:
  name: program_enrollments
  schema: public
configuration:
  column_config:
    author_id:
      custom_name: authorId
    completed_at:
      custom_name: completedAt
    created_at:
      custom_name: createdAt
    current_day:
      custom_name: currentDay
    id:
      custom_name: id
    program_slug:
      custom_name: programSlug
    updated_at:
      custom_name: updatedAt
  custom_column_names:
    author_id: authorId
    completed_at: completedAt
    created_at: createdAt
    current_day: currentDay
    id: id
    program_slug: programSlug
    updated_at: updatedAt
  custom_name: programEnrollments
  custom_root_fields:
    delete: deleteProgramEnrollments
    delete_by_pk: deleteProgramEnrollmentsByPk
    insert: insertProgramEnrollments
    insert_one: insertProgramEnrollmentsOne
    select: programEnrollments
    select_aggregate: programEnrollmentsAggregate
    select_by_pk: programEnrollmentsByPk
    select_stream: programEnrollmentsStream
    update: updateProgramEnrollments
    update_by_pk: updateProgramEnrollmentsByPk
    update_many: updateProgramEnrollmentsMany
object_relationships:
  - name: author
    using:
      foreign_key_constraint_on: author_id
insert_permissions:
  - role: user
    permission:
      check: {}
      set:
        author_id: X-Hasura-User-Id
      columns:
        - id
        - program_slug
        - current_day
        - completed_at
select_permissions:
  - role: user
    permission:
      columns:
        - author_id
        - completed_at
        - created_at
        - current_day
        - id
        - program_slug
        - updated_at
      filter:
        author_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: true
update_permissions:
  - role: user
    permission:
      columns:
        - current_day
        - completed_at
      filter:
        author_id:
          _eq: X-Hasura-User-Id
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        author_id:
          _eq: X-Hasura-User-Id
