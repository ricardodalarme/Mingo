targets:
  $default:
    builders:
      auto_route_generator:auto_route_generator:
        generate_for:
          - lib/features/**/presentation/**.dart
          - lib/features/dev_menu/debug_sign_in/*_page.dart
      graphql_codegen:
        options:
          assetsPath: lib/features/**/data_sources/**.graphql
          addTypenameExcludedPaths:
            - subscription
          clients:
            - graphql
          disableCopyWithGeneration: true
          generatedFileHeader: "// dart format width=100\n"
          namingSeparator: ""
          outputDirectory: generated
          setOperationName: true
          scalars:
            date:
              type: DateTime
              toJsonFunctionName: ((v) => v.toIso8601String().substring(0, 10))
            timestamptz:
              type: DateTime
              toJsonFunctionName: ((v) => v.toUtc().toIso8601String())
            uuid:
              type: String
            jsonb:
              type: dynamic
              fromJsonFunctionName: decodeJsonb
              toJsonFunctionName: encodeJsonb
              import: package:network/network.dart
            time:
              type: String
            smallint:
              type: int
