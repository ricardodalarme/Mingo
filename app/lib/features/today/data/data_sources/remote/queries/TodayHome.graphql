query TodayHome {
  today {
    localDate
    weekStart
    partnerId
    partnerName
    togetherSince
    unopenedCards
    slipsThisWeek
    slipsTotal
    slipDays
    hasPendingInvite
    unseenSignals
    card {
      status
    }
    plus {
      hasPlus
    }
  }
  question: dailyContent(args: { kind: "question" }) {
    slug
    title
    tags
  }
  idea: dailyContent(args: { kind: "daily_idea" }) {
    slug
    title
    body
  }
}
