mutation AddImportantDate(
  $id: uuid!
  $title: String!
  $kind: ImportantDateKind_enum!
  $month: smallint!
  $day: smallint!
  $year: smallint
  $yearly: Boolean!
  $remindDays: [smallint!]!
  $origin: ImportantDateOrigin_enum!
  $holidayKey: String
  $coupleId: uuid
) {
  insertImportantDatesOne(
    object: {
      id: $id
      title: $title
      kind: $kind
      month: $month
      day: $day
      year: $year
      yearly: $yearly
      remindDays: $remindDays
      origin: $origin
      holidayKey: $holidayKey
      coupleId: $coupleId
    }
  ) {
    id
  }
}
