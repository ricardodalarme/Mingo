mutation AddRitual(
  $id: uuid!
  $title: String!
  $cadence: RitualCadence_enum!
  $weekday: smallint
  $atTime: time
  $reminder: Boolean!
  $coupleId: uuid
) {
  insertRitualsOne(
    object: {
      id: $id
      title: $title
      cadence: $cadence
      weekday: $weekday
      atTime: $atTime
      reminder: $reminder
      coupleId: $coupleId
    }
  ) {
    id
  }
}
