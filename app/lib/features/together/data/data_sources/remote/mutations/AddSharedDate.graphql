mutation AddSharedDate(
  $title: String!
  $month: smallint!
  $day: smallint!
  $year: smallint!
  $coupleId: uuid
) {
  insertImportantDatesOne(
    object: {
      title: $title
      kind: custom
      month: $month
      day: $day
      year: $year
      yearly: false
      remindDays: [1]
      coupleId: $coupleId
    }
  ) {
    id
  }
}
