mutation UpdateRitual(
  $id: uuid!
  $title: String!
  $cadence: RitualCadence_enum!
  $weekday: smallint
  $atTime: time
  $reminder: Boolean!
) {
  updateRitualsByPk(
    pk_columns: { id: $id }
    _set: {
      title: $title
      cadence: $cadence
      weekday: $weekday
      atTime: $atTime
      reminder: $reminder
    }
  ) {
    id
  }
}
