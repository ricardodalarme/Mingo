query Rituals {
  rituals(
    where: { archivedAt: { _is_null: true } }
    order_by: [{ createdAt: desc_nulls_last }]
    limit: 100
  ) {
    id
    title
    cadence
    weekday
    atTime
    reminder
    plannerId
    logs(order_by: [{ doneOn: desc_nulls_last }], limit: 1) {
      doneOn
    }
  }
}
