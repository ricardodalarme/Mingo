query ChatStatus($userId: uuid!) {
  plusStates(where: { userId: { _eq: $userId } }, limit: 1) {
    chatMessagesLeftToday
  }
  plusLimit: appConfigByPk(key: "chat_messages_per_day_plus") {
    value
  }
  freeLimit: appConfigByPk(key: "chat_messages_per_day_free") {
    value
  }
  userSettingsByPk(userId: $userId) {
    userId
    chatEnabled
  }
}
