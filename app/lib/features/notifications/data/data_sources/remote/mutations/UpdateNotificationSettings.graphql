mutation UpdateNotificationSettings(
  $userId: uuid!
  $enabled: Boolean!
  $cardDay: smallint!
  $cardHour: smallint!
  $dailyMax: smallint!
  $mutes: jsonb!
) {
  updateNotificationSettings(
    where: { userId: { _eq: $userId } }
    _set: { enabled: $enabled, cardDay: $cardDay, cardHour: $cardHour, dailyMax: $dailyMax }
  ) {
    affected_rows
  }
  setNotificationMutes(args: { types: $mutes }) {
    type
  }
}
