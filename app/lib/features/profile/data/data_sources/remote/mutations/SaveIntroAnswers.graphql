mutation SaveIntroAnswers(
  $profileId: uuid!
  $phase: RelationshipPhase_enum
  $goals: [userGoals_insert_input!]!
) {
  updateUserSettingsByPk(pk_columns: { userId: $profileId }, _set: { phase: $phase }) {
    userId
  }
  deleteUserGoals(where: { userId: { _eq: $profileId } }) {
    affected_rows
  }
  insertUserGoals(objects: $goals) {
    affected_rows
  }
}
