mutation SaveProfileSetup(
  $profileId: uuid!
  $displayName: String!
  $theme: AppTheme_enum!
  $partnerName: String
  $togetherSince: date
  $onboardedAt: timestamptz!
) {
  updateProfiles(where: { id: { _eq: $profileId } }, _set: { displayName: $displayName }) {
    affected_rows
  }
  updateUserSettings(
    where: { userId: { _eq: $profileId } }
    _set: {
      theme: $theme
      partnerName: $partnerName
      togetherSince: $togetherSince
      onboardedAt: $onboardedAt
    }
  ) {
    affected_rows
  }
}
