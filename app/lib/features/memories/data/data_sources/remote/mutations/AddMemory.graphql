mutation AddMemory(
  $id: uuid!
  $title: String!
  $body: String
  $happenedOn: date!
  $place: String
  $coupleId: uuid
) {
  insertMemories(
    objects: [
      {
        id: $id
        title: $title
        body: $body
        happenedOn: $happenedOn
        place: $place
        coupleId: $coupleId
      }
    ]
  ) {
    affected_rows
  }
}
