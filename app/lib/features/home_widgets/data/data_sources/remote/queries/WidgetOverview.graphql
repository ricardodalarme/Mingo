query WidgetOverview($userId: uuid!) {
  today(limit: 1) {
    userId
    coupleId
    partnerName
    togetherSince
    cardId
    unopenedCards
    slipsThisWeek
    slipsTotal
    slipDays
    nextDateOn
    nextDate {
      title
    }
  }
  me: profilesByPk(id: $userId) {
    displayName
  }
  settings: userSettingsByPk(userId: $userId) {
    userId
    phase
    togetherSince
    widgetAllowPartnerNotes
    widgetOnLockScreen
    widgetShowNames
  }
  notificationSettingsByPk(userId: $userId) {
    cardDay
    cardHour
  }
  plusStates(where: { userId: { _eq: $userId } }, limit: 1) {
    hasPlus
  }
  partnerNote: partnerMessages(
    where: { forWidget: { _eq: true }, senderId: { _neq: $userId }, recipientId: { _eq: $userId } }
    order_by: [{ createdAt: desc_nulls_last }]
    limit: 1
  ) {
    body
    kind
    mediaFileId
    createdAt
  }
  partnerMood: sharedMoods(
    where: { userId: { _neq: $userId } }
    order_by: [{ updatedAt: desc }]
    limit: 1
  ) {
    mood
    updatedAt
  }
  partnerMiss: signals(
    where: { kind: { _eq: miss_us }, senderId: { _neq: $userId } }
    order_by: [{ createdAt: desc }]
    limit: 1
  ) {
    createdAt
  }
  myMood: moods(where: { authorId: { _eq: $userId } }, order_by: [{ day: desc_nulls_last }], limit: 1) {
    mood
  }
  rituals(
    where: { archivedAt: { _is_null: true } }
    order_by: [{ createdAt: desc_nulls_last }]
    limit: 1
  ) {
    id
    title
    cadence
    weekday
    atTime
  }
  idea: dailyContent(args: { kind: "daily_idea" }, limit: 1) {
    slug
    title
    body
  }
}
