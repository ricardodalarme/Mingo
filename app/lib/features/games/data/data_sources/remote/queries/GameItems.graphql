query GameItems($kind: ContentKind_enum!, $locale: String!, $limit: Int!) {
  contentItems(
    limit: $limit
    where: {
      kind: { _eq: $kind }
      locale: { _eq: $locale }
      plusOnly: { _eq: false }
      published: { _eq: true }
    }
    order_by: [{ position: asc_nulls_last }]
  ) {
    slug
    title
    body
  }
}
