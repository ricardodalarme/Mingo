query MyCards($limit: Int, $offset: Int) {
  cards(
    limit: $limit
    offset: $offset
    where: { status: { _eq: sent } }
    order_by: [{ sentAt: desc }]
  ) {
    id
    authorId
    sentAt
    weekStart
    items {
      id
    }
    reaction {
      reaction
      reply
    }
    open {
      openedAt
    }
  }
}
