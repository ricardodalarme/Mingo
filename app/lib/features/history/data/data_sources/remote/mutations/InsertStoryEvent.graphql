mutation InsertStoryEvent(
  $id: uuid!
  $coupleId: uuid
  $kind: StoryEventKind_enum!
  $title: String
  $happenedOn: date!
  $datePrecision: DatePrecision_enum!
) {
  insertStoryEvents(
    objects: [
      {
        id: $id
        coupleId: $coupleId
        kind: $kind
        title: $title
        happenedOn: $happenedOn
        datePrecision: $datePrecision
      }
    ]
  ) {
    affected_rows
  }
}
