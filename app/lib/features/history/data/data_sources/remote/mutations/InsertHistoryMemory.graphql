mutation InsertHistoryMemory(
  $id: uuid!
  $coupleId: uuid
  $title: String!
  $body: String
  $happenedOn: date!
  $datePrecision: DatePrecision_enum!
  $place: String
  $origin: MemoryOrigin_enum!
) {
  insertMemories(
    objects: [
      {
        id: $id
        coupleId: $coupleId
        title: $title
        body: $body
        happenedOn: $happenedOn
        datePrecision: $datePrecision
        place: $place
        origin: $origin
      }
    ]
  ) {
    affected_rows
  }
}
