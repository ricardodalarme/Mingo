mutation UpdateStoryEvent(
  $id: uuid!
  $coupleId: uuid
  $kind: StoryEventKind_enum!
  $title: String
  $happenedOn: date!
  $datePrecision: DatePrecision_enum!
) {
  updateStoryEvents(
    where: { id: { _eq: $id } }
    _set: {
      coupleId: $coupleId
      kind: $kind
      title: $title
      happenedOn: $happenedOn
      datePrecision: $datePrecision
    }
  ) {
    affected_rows
  }
}
