mutation UpdateHistoryMemory(
  $id: uuid!
  $coupleId: uuid
  $title: String!
  $body: String
  $happenedOn: date!
  $datePrecision: DatePrecision_enum!
  $place: String
) {
  updateMemories(
    where: { id: { _eq: $id } }
    _set: {
      coupleId: $coupleId
      title: $title
      body: $body
      happenedOn: $happenedOn
      datePrecision: $datePrecision
      place: $place
    }
  ) {
    affected_rows
  }
}
