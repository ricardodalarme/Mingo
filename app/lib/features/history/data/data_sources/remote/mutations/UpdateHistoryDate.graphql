mutation UpdateHistoryDate(
  $id: uuid!
  $coupleId: uuid
  $title: String!
  $kind: ImportantDateKind_enum!
  $month: smallint!
  $day: smallint!
  $year: smallint
  $yearly: Boolean!
) {
  updateImportantDates(
    where: { id: { _eq: $id } }
    _set: {
      coupleId: $coupleId
      title: $title
      kind: $kind
      month: $month
      day: $day
      year: $year
      yearly: $yearly
    }
  ) {
    affected_rows
  }
}
