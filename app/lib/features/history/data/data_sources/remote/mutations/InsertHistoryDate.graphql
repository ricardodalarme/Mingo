mutation InsertHistoryDate(
  $id: uuid!
  $coupleId: uuid
  $title: String!
  $kind: ImportantDateKind_enum!
  $month: smallint!
  $day: smallint!
  $year: smallint
  $yearly: Boolean!
) {
  insertImportantDates(
    objects: [
      {
        id: $id
        coupleId: $coupleId
        title: $title
        kind: $kind
        month: $month
        day: $day
        year: $year
        yearly: $yearly
        origin: manual
      }
    ]
  ) {
    affected_rows
  }
}
