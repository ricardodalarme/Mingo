query HistoryOverview($userId: uuid!, $year: Int!) {
  profile: profilesByPk(id: $userId) {
    id
    displayName
    avatarFileId
    avatarKind
  }
  member: coupleMembersByPk(userId: $userId) {
    couple {
      id
      members {
        userId
        profile {
          id
          displayName
          avatarFileId
          avatarKind
        }
      }
    }
  }
  settings: userSettingsByPk(userId: $userId) {
    userId
    phase
    togetherSince
    partnerName
    relationshipStatus
  }
  storyEvents(order_by: [{ happenedOn: desc_nulls_last }], limit: 51) {
    id
    authorId
    coupleId
    kind
    title
    happenedOn
    datePrecision
  }
  memories(order_by: [{ happenedOn: desc_nulls_last }], limit: 51) {
    id
    authorId
    coupleId
    title
    body
    happenedOn
    datePrecision
    place
    origin
  }
  importantDates(
    order_by: [{ year: desc_nulls_last }, { month: desc_nulls_last }, { day: desc_nulls_last }]
    limit: 51
  ) {
    id
    authorId
    coupleId
    title
    kind
    month
    day
    year
    yearly
    hidden
  }
  yearRecaps(where: { year: { _eq: $year } }, limit: 1) {
    year
    slips
    cardsSent
    cardsReceived
    memories
    firsts
    ritualsDone
  }
}
