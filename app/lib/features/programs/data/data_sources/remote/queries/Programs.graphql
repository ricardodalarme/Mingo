query Programs($locale: String!) {
  programs: contentItems(
    where: { kind: { _eq: program }, locale: { _eq: $locale }, published: { _eq: true } }
    order_by: [{ position: asc_nulls_last }]
    limit: 100
  ) {
    slug
    title
    body
    position
    plusOnly
  }
  lessons: contentItems(
    where: { kind: { _eq: lesson }, locale: { _eq: $locale }, published: { _eq: true } }
    order_by: [{ position: asc_nulls_last }]
    limit: 500
  ) {
    slug
    title
    body
    parentSlug
    position
    plusOnly
  }
}
