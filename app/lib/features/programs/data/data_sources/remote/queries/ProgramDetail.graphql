query ProgramDetail($slug: String!, $locale: String!) {
  program: contentItems(
    where: {
      kind: { _eq: program }
      slug: { _eq: $slug }
      locale: { _eq: $locale }
      published: { _eq: true }
    }
    limit: 1
  ) {
    slug
    title
    body
    position
    plusOnly
  }
  lessons: contentItems(
    where: {
      kind: { _eq: lesson }
      parentSlug: { _eq: $slug }
      locale: { _eq: $locale }
      published: { _eq: true }
    }
    order_by: [{ position: asc_nulls_last }]
    limit: 100
  ) {
    slug
    title
    body
    parentSlug
    position
    plusOnly
  }
}
