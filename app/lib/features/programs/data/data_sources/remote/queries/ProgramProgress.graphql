query ProgramProgress($slug: String!) {
  programEnrollments(
    where: { programSlug: { _eq: $slug } }
    order_by: [{ createdAt: asc_nulls_last }]
    limit: 1
  ) {
    programSlug
    currentDay
    completedAt
  }
  lessonProgress(
    where: { programSlug: { _eq: $slug } }
    order_by: [{ lessonDay: asc_nulls_last }]
    limit: 100
  ) {
    programSlug
    lessonDay
    status
  }
}
